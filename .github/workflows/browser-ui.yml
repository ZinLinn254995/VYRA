name: VYRA Browser UI Tests

on:
  pull_request:
  push:
    branches: [main, 'rebuild/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-package-lock
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production build
        run: npm run build
      # The former Studio-shell browser specs target a retired navigation layout.
      # Keep them in the repository for reference; run the current Marketplace/Workspace suite here.
      - name: Run current Marketplace and Workspace browser tests
        run: mkdir -p artifacts && npx playwright test tests/current-marketplace-workspace.spec.ts
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyra-browser-ui-report
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
