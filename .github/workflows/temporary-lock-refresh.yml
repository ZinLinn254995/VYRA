name: Temporary Lockfile Refresh Artifact

on:
  push:
    branches:
      - feature/my-storyboard

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-storyboard
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "fix: synchronize npm lockfile for Cloudflare builds"
            git push origin HEAD:feature/my-storyboard
          fi
