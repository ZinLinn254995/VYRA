name: VYRA Database Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/server/ai.ts'
      - 'src/server/usageLedger.ts'
      - 'src/server/usageLedgerContract.ts'
      - 'src/server/supabaseAuth.ts'
      - 'tests/openrouter-usage-ledger-local-e2e.spec.ts'
      - 'tests/openrouter-usage-ledger-api.spec.ts'
      - 'tests/usage-ledger-recorder.spec.ts'
      - 'package.json'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/server/ai.ts'
      - 'src/server/usageLedger.ts'
      - 'src/server/usageLedgerContract.ts'
      - 'src/server/supabaseAuth.ts'
      - 'tests/openrouter-usage-ledger-local-e2e.spec.ts'
      - 'tests/openrouter-usage-ledger-api.spec.ts'
      - 'tests/usage-ledger-recorder.spec.ts'
      - 'package.json'
      - '.github/workflows/database.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase services
        run: supabase start -x studio,imgproxy,inbucket
      - name: Apply migrations and run RLS tests
        run: |
          supabase db reset
          supabase test db
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Discover local Supabase status options
        run: supabase status --help
      - name: Run authenticated local Supabase usage-ledger E2E
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          : "${API_URL:?Supabase API_URL was not returned by supabase status}"
          : "${ANON_KEY:?Supabase ANON_KEY was not returned by supabase status}"
          : "${SERVICE_ROLE_KEY:?Supabase SERVICE_ROLE_KEY was not returned by supabase status}"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export VYRA_USAGE_LEDGER_ENABLED=true
          npm run test:usage-ledger-local-e2e
