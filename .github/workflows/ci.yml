name: VYRA CI

on:
  pull_request:
  push:
    branches: [main, 'rebuild/**', 'feat/vyral-100-percent-acceptance', 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install browser test dependency
        run: npm install --no-save @playwright/test@1.56.1
      - name: TypeScript check
        run: npm run lint
      - name: OpenAI Chat streaming contract tests
        run: npm run test:ai-chat-stream
      - name: Global AI Chat safe action tests
        run: npm run test:global-chat-actions
      - name: Global AI Chat action planner policy tests
        run: npm run test:global-chat-planner
      - name: VYRA app-wide AI capability policy tests
        run: npm run test:ai-capabilities
      - name: VYRA AI capability executor security tests
        run: npm run test:ai-capability-executor
      - name: Vyral creation approval and retry-safety tests
        run: npm run test:vyral-creation-action
      - name: VYRA AI capability implementation coverage tests
        run: npm run test:ai-capability-coverage
      - name: Master Timeline operation validation tests
        run: npm run test:master-timeline-operations
      - name: Master Timeline audio playback planner tests
        run: npm run test:master-timeline-audio-playback
      - name: Master Timeline multi-track audio engine tests
        run: npm run test:master-timeline-audio-playback-engine
      - name: Master Timeline video playback planner tests
        run: npm run test:master-timeline-video-playback
      - name: Master Timeline video playback engine tests
        run: npm run test:master-timeline-video-playback-engine
      - name: Master Timeline Text overlay tests
        run: npm run test:master-timeline-text-overlay
      - name: Workspace secure Video preview tests
        run: npm run test:workspace-video-preview
      - name: Media model selection policy tests
        run: npm run test:media-model-selection
      - name: Media generation approval contract tests
        run: npm run test:media-generation-contract
      - name: Media credit pricing exact-decimal tests
        run: npm run test:media-credit-pricing
      - name: Vyral generated Asset provenance contract tests
        run: npm run test:vyral-generated-asset-provenance
      - name: Vyral Asset ingestion lifecycle tests
        run: npm run test:vyral-asset-ingestion
      - name: Vyral Asset upload action validation tests
        run: npm run test:vyral-asset-upload-action
      - name: Vyral Asset rename action validation tests
        run: npm run test:vyral-asset-rename-action
      - name: Vyral Asset metadata action validation tests
        run: npm run test:vyral-asset-metadata-action
      - name: Vyral folder action validation tests
        run: npm run test:vyral-folder-action
      - name: Test Asset relationship action validation
        run: npm run test:vyral-asset-relationship-action
      - name: Vyral private Asset playback authorization tests
        run: npm run test:vyral-asset-playback
      - name: Supabase auth verification tests
        run: npm run test:auth
      - name: Customer project API tests
        run: npm run test:projects
      - name: Cloud project restore tests
        run: npm run test:restore
      - name: Usage ledger contract tests
        run: npm run test:usage-ledger
      - name: OpenRouter usage ledger recorder tests
        run: npm run test:usage-ledger-recorder
      - name: OpenRouter pricing API auth tests
        run: npm run test:pricing-auth
      - name: Credit transfer API tests
        run: npm run test:credit-transfers
      - name: Credit ledger lifecycle service tests
        run: npm run test:credit-ledger
      - name: Universal consistency engine tests
        run: npm run test:consistency
      - name: Audio export validation and runtime tests
        run: npm run test:audio-export
      - name: VYRAL package archive tests
        run: npm run test:vyral-package
      - name: Vyral descriptive semantic DNA v1 tests
        run: npm run test:vyral-semantic-dna
      - name: Vyral source-bound semantic DNA completeness tests
        run: npm run test:vyral-semantic-completeness
      - name: VYRA DNA v3 lossless reconstruction tests
        run: npm run test:vyral-dna-v3
      - name: Protected Vyral System Files export, import and integrity tests
        run: npm run test:vyral-system-files
      - name: Vyral Master DNA v1 validation and fingerprint tests
        run: npm run test:vyral-master-dna
      - name: Vyral Universal File DNA v1 exact binary tests
        run: npm run test:vyral-file-dna
      - name: Vyral AI Vision safety contract tests
        run: npm run test:vyral-ai-vision
      - name: Vyral AI-generated details and creator-edit preservation tests
        run: npm run test:vyral-ai-details
      - name: Workspace storyboard cloud sync reconciliation tests
        run: npm run test:workspace-storyboards
      - name: Vyral DNA change-set deterministic validation tests
        run: npm run test:vyral-dna-change-set
      - name: Vyral DNA change-set atomic application tests
        run: npm run test:vyral-dna-change-set-apply
      - name: Vyral creator-confirmed Vision evidence tests
        run: npm run test:vyral-vision-evidence
      - name: Vyral Asset DNA assessment tests
        run: npm run test:vyral-asset-dna-assessment
      - name: Vyral Asset DNA revision allocator tests
        run: npm run test:vyral-dna-revision-allocator
      - name: Vyral portable DNA-only reconstruction runtime tests
        run: npm run test:vyral-portable-reconstruction
      - name: ORIGIN-01 comparator storage path security tests
        run: npm run test:vyral-origin-comparator-security
      - name: Shared Vyral storage path security tests
        run: npm run test:vyral-storage-path-security
      - name: Vyral raster upload DNA readiness gate tests
        run: npm run test:vyral-raster-upload-dna-gate
      - name: Vyral perceptual fingerprint algorithm tests
        run: npm run test:vyral-perceptual-fingerprint
      - name: Vyral normalized reconstruction metric tests
        run: npm run test:vyral-reconstruction-metrics
      - name: Vyral Asset DNA assessment intent tests
        run: npm run test:vyral-asset-dna-intent
      - name: Vyral reconstruction history intent tests
        run: npm run test:vyral-reconstruction-history
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/build-vyral-master-dna/index.ts supabase/functions/verify-vyral-asset/index.ts supabase/functions/verify-vyral-dna-v3/index.ts supabase/functions/fingerprint-vyral-raster-version/index.ts supabase/functions/resolve-vyral-resource/index.ts supabase/functions/resolve-public-vyral-resource/index.ts supabase/functions/extract-vyral-asset-dna-v3/index.ts supabase/functions/evaluate-vyral-quality/index.ts supabase/functions/assess-vyral-asset-dna/index.ts supabase/functions/manage-vyral-asset-dna-proposal/index.ts supabase/functions/record-vyral-vision-review/index.ts supabase/functions/promote-vyral-vision-field/index.ts supabase/functions/vyra-openai-chat/index.ts supabase/functions/compare-origin-01-reconstruction/index.ts supabase/functions/verify-origin-01-dna-v3/index.ts supabase/functions/manage-runway-provider/index.ts supabase/functions/quote-runway-media/index.ts supabase/functions/approve-runway-media-quote/index.ts supabase/functions/approve-runway-media-credit/index.ts supabase/functions/create-runway-media-job/index.ts supabase/functions/manage-media-credit-pricing/index.ts
      - name: SEO discovery and canonical contract tests
        run: npm run test:seo
      - name: Production build
        run: npm run build

      - name: Vyral license policy v1 tests
        run: npm run test:vyral-license
      - name: Vyral resource resolver security policy tests
        run: npm run test:vyral-resource-resolver

      - name: Vyral deterministic quality grading, snapshot applicability, creator context and trusted evidence tests
        run: npm run test:vyral-quality
