name: VYRA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install browser test dependency
        run: npm install --no-save @playwright/test
      - name: TypeScript check
        run: npm run lint
      - name: Supabase auth verification tests
        run: npm run test:auth
      - name: Customer project API tests
        run: npm run test:projects
      - name: Cloud project restore tests
        run: npm run test:restore
      - name: Production build
        run: npm run build
